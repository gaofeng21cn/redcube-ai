name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/redcube-ai-source-venv
        run: |
          uv sync --locked --no-dev --extra native --no-install-project --python 3.12
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "REDCUBE_PYTHON_COMMAND=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
          npm ci
      - name: Run source gate
        run: scripts/verify.sh ci
