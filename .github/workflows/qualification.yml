name: Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standard-agent-admission:
    name: OPL standard Agent admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout OPL Framework
        run: git clone --depth=1 --filter=blob:none https://github.com/gaofeng21cn/one-person-lab.git ../one-person-lab
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Build OPL Framework
        run: |
          npm ci --prefix ../one-person-lab --ignore-scripts
          npm run --prefix ../one-person-lab build
      - name: Validate OPL Agent interfaces
        run: |
          ../one-person-lab/bin/opl agents interfaces --repo-dir "$GITHUB_WORKSPACE" --json
          ../one-person-lab/bin/opl agents conformance --agent "rca=$GITHUB_WORKSPACE" --json

  native-ppt-proof:
    name: Native PPT proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: native-ppt-proof-playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/redcube-ai-native-ppt-proof-venv
        run: |
          uv sync --locked --no-dev --extra native --no-install-project --python 3.12
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "REDCUBE_PYTHON_COMMAND=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
          npm ci
      - name: Run native PPT proof
        run: tools/native-ppt-proof/run.sh --output-dir artifacts/native-ppt-proof
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ppt-proof
          path: |
            artifacts/native-ppt-proof
            artifacts/native-ppt-proof/artifact-index.json

  image-ppt-proof:
    name: Image PPT proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: image-ppt-proof-playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/redcube-ai-image-ppt-proof-venv
        run: |
          uv sync --locked --no-dev --extra native --no-install-project --python 3.12
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "REDCUBE_PYTHON_COMMAND=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
          npm ci
      - name: Run image PPT proof
        run: tools/image-ppt-proof/run.sh --output-dir artifacts/image-ppt-proof --mock-image-generation
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-ppt-proof
          path: |
            artifacts/image-ppt-proof
            artifacts/image-ppt-proof/artifact-index.json

  image-native-ppt-proof:
    name: Container native PPT proof (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build proof image
        run: docker build --file tools/native-ppt-proof/Dockerfile --tag redcube-native-ppt-proof .
      - name: Run image doctor
        run: |
          mkdir -p artifacts/image-native-ppt-proof
          docker run --rm redcube-native-ppt-proof > artifacts/image-native-ppt-proof/image-doctor.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/image-native-ppt-proof/image-doctor.json').read_text())
          assert report['status'] == 'ok', report
          assert report['renderer_availability']['linux_native_proof']['available'], report
          PY
          docker run --rm redcube-native-ppt-proof node -p \
            'JSON.stringify({node:process.version,arch:process.arch,platform:process.platform})' \
            > artifacts/image-native-ppt-proof/image-runtime.json
      - name: Run native PPT proof in image
        run: |
          docker run --rm \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --mount type=volume,target=/workspace/node_modules \
            --workdir /workspace \
            redcube-native-ppt-proof \
            bash -c 'npm ci && tools/native-ppt-proof/run.sh --skip-system-deps --output-dir artifacts/image-native-ppt-proof'
      - name: Restore container artifact ownership
        if: always()
        run: |
          if [ -d artifacts/image-native-ppt-proof ]; then
            sudo chown -R "$(id -u):$(id -g)" artifacts/image-native-ppt-proof
          fi
      - name: Upload container proof artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-native-ppt-proof-${{ matrix.arch }}
          path: |
            artifacts/image-native-ppt-proof
            artifacts/image-native-ppt-proof/artifact-index.json
