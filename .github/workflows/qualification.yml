name: Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standard-agent-admission:
    name: OPL standard Agent admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout OPL Framework
        run: git clone --depth=1 --filter=blob:none https://github.com/gaofeng21cn/one-person-lab.git ../one-person-lab
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Build OPL Framework
        run: |
          npm ci --prefix ../one-person-lab --ignore-scripts
          npm run --prefix ../one-person-lab build
      - name: Validate OPL Agent interfaces
        run: |
          ../one-person-lab/bin/opl agents interfaces --repo-dir "$GITHUB_WORKSPACE" --json
          ../one-person-lab/bin/opl agents conformance --agent "rca=$GITHUB_WORKSPACE" --json

  native-ppt-proof:
    name: Native PPT proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: native-ppt-proof-playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/redcube-ai-native-ppt-proof-venv
        run: |
          uv sync --locked --no-dev --extra native --no-install-project --python 3.12
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "REDCUBE_PYTHON_COMMAND=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
          npm ci
      - name: Run native PPT proof
        run: tools/native-ppt-proof/run.sh --output-dir artifacts/native-ppt-proof
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ppt-proof
          path: |
            artifacts/native-ppt-proof
            artifacts/native-ppt-proof/artifact-index.json

  image-ppt-proof:
    name: Image PPT proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.9.5'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: image-ppt-proof-playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/redcube-ai-image-ppt-proof-venv
        run: |
          uv sync --locked --no-dev --extra native --no-install-project --python 3.12
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "REDCUBE_PYTHON_COMMAND=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
          npm ci
      - name: Run image PPT proof
        run: tools/image-ppt-proof/run.sh --output-dir artifacts/image-ppt-proof --mock-image-generation
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-ppt-proof
          path: |
            artifacts/image-ppt-proof
            artifacts/image-ppt-proof/artifact-index.json
